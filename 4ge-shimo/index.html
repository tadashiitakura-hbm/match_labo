// ---------- 問題一覧 ----------
function renderList(main){
  if(!RUNTIME.listView)RUNTIME.listView='browse';
  if(RUNTIME.listView==='browse'){
    const rounds=[1,2,3,4,5];
    let html='<div class="card"><h3>問題一覧</h3><p class="small-note">回をえらぶと、その中の問題一覧が出ます。まだ解放されていない回は🔒です。</p></div>';
    html+='<div class="grid">';
    rounds.forEach(r=>{
      const label = r===5 ? '第5回（総合）' : `第${r}回`;
      const unlocked=isRoundUnlocked(r);
      const st=unlocked?roundState(r):'none';
      const stPill = unlocked ? (st==='none'?'' : `<span class="${st==='mastered'?'pill mastered':'pill progress'}">${ROUND_STATE_LABEL[st]}</span>`) : '<span class="small-note">まだ解放されていません</span>';
      html+=`<div class="card ${unlocked?'mode-card':''}" data-r="${r}" style="${unlocked?'':'opacity:.55;'}">
        <h3>${unlocked?label:`🔒 ${label}`}</h3>
        ${stPill}
      </div>`;
    });
    html+='</div>';
    main.innerHTML=html;
    main.querySelectorAll('.mode-card[data-r]').forEach(el=>{
      el.onclick=()=>{RUNTIME.listView='round';RUNTIME.listRound=parseInt(el.dataset.r,10);go('list');};
    });
    return;
  }
  if(RUNTIME.listView==='round'){
    const r=RUNTIME.listRound;
    if(!isRoundUnlocked(r)){
      main.innerHTML=`<div class="card"><h3>🔒 まだ解放されていません</h3><p class="small-note">この回は週送りスケジュールでまだ解放されていません。</p><button class="ghost small" id="btnBackRounds">← 回をえらび直す</button></div>`;
      document.getElementById('btnBackRounds').onclick=()=>{RUNTIME.listView='browse';go('list');};
      return;
    }
    let items;
    if(r===5){
      // 総合回：基本問題は第1〜4回のbasicをまとめて再掲、練習問題はround5のpractice
      const basicAll=PROBLEMS.filter(p=>p.cat==='basic').sort((a,b)=>a.round-b.round||a.no-b.no);
      const practice5=PROBLEMS.filter(p=>p.round===5&&p.cat==='practice').sort((a,b)=>a.no-b.no);
      items={example:[],basic:basicAll,practice:practice5};
    } else {
      items={
        example:PROBLEMS.filter(p=>p.round===r&&p.cat==='example').sort((a,b)=>a.no-b.no),
        basic:PROBLEMS.filter(p=>p.round===r&&p.cat==='basic').sort((a,b)=>a.no-b.no),
        practice:PROBLEMS.filter(p=>p.round===r&&p.cat==='practice').sort((a,b)=>a.no-b.no),
      };
    }
    const label = r===5 ? '第5回（総合）' : `第${r}回`;
    let html=`<div class="card"><h3>${label} ／ 問題一覧</h3><button class="ghost small" id="btnBackRounds">← 回をえらび直す</button></div>`;
    ['example','basic','practice'].forEach(cat=>{
      if(!items[cat].length)return;
      html+=`<div class="card"><h4>${CAT_LABEL[cat]}</h4><div class="grid">`;
      items[cat].forEach(p=>{
        const st=masteryState(p.key);
        const flagged=DATA.flags[p.key]&&DATA.flags[p.key].on;
        const roundTag = r===5 && cat==='basic' ? `第${p.round}回・` : '';
        const pillClass = st==='mastered' ? 'pill mastered' : 'pill progress';
        const stPill = st==='none' ? '' : ` <span class="${pillClass}">${ROUND_STATE_LABEL[st]}</span>`;
        const ptitle=problemTitle(p.key);
        html+=`<div class="card mode-card qcard" data-mk="${p.key}">
          <div>${roundTag}${CAT_LABEL[p.cat]} ${p.no}${stPill}${flagged?' <span class="pill on">🚩</span>':''}</div>
          <div class="small-note" style="margin-top:2px;">${ptitle}</div>
        </div>`;
      });
      html+='</div></div>';
    });
    main.innerHTML=html;
    document.getElementById('btnBackRounds').onclick=()=>{RUNTIME.listView='browse';go('list');};
    main.querySelectorAll('.qcard[data-mk]').forEach(el=>{
      el.onclick=()=>{
        RUNTIME={masteryFocusKey:el.dataset.mk};
        go('mastery',true);
      };
    });
    return;
  }
}

// ---------- 問題表示の共通処理 ----------
function renderQuestionCard(main,q,opts){
  opts=opts||{};
  const showHint=!!opts.showHint;
  const startTime=Date.now();
  let checkCount=0;
  let solved=false;

  const wrap=document.createElement('div');
  wrap.className='card';
  wrap.innerHTML=`
    <div class="small-note">${opts.badge||''}</div>
    <h3>${q.title}</h3>
    <div class="stem">${q.stem}</div>
    ${q.svg?`<div class="svgwrap">${q.svg}</div>`:''}
    <div id="fields"></div>
    <div id="judge"></div>
    <div class="btnrow">
      <button class="primary" id="btnCheck">こたえあわせ</button>
      ${showHint?'<button class="ghost small" id="btnHint">🔑 ヒント</button>':''}
      <button class="ghost small" id="btnSol">解法を見る</button>
      ${opts.extraButtons||''}
    </div>
    <div id="hintArea"></div>
    <div id="solArea"></div>
  `;
  main.appendChild(wrap);

  const fieldsDiv=wrap.querySelector('#fields');
  q.fields.forEach(f=>{
    const row=document.createElement('div');
    row.className='field-row';
    row.innerHTML=`<label>${f.label}</label><input type="text" data-id="${f.id}" autocomplete="off">`;
    fieldsDiv.appendChild(row);
  });

  let hintStep=0;
  if(showHint){
    wrap.querySelector('#btnHint').onclick=()=>{
      const area=wrap.querySelector('#hintArea');
      if(hintStep<q.hints.length){
        const box=document.createElement('div');
        box.className='hint-box';
        box.textContent=`ヒント${hintStep+1}: ${q.hints[hintStep]}`;
        area.appendChild(box);
        hintStep++;
      }
    };
  }
  wrap.querySelector('#btnSol').onclick=()=>{
    showSolution();
    highlightNext();
  };
  function showSolution(){
    const area=wrap.querySelector('#solArea');
    area.innerHTML=`<div class="solution-box"><b>【解法】</b><br>${q.solution}</div>`;
  }
  function highlightNext(){
    const checkBtn=wrap.querySelector('#btnCheck');
    if(checkBtn){checkBtn.classList.remove('primary');checkBtn.classList.add('ghost');}
    const nextBtn=wrap.querySelector('.nextbtn');
    if(nextBtn){nextBtn.classList.remove('ghost');nextBtn.classList.add('primary');}
  }

  function checkAnswer(){
    checkCount++;
    const allOk=q.fields.every(f=>{
      const inp=wrap.querySelector(`input[data-id="${f.id}"]`);
      return f.check(inp.value);
    });
    const judge=wrap.querySelector('#judge');
    const elapsed=Math.round((Date.now()-startTime)/1000);
    if(allOk){
      judge.innerHTML=`<div class="judge-ok">⭕ せいかい！（${elapsed}秒）</div>`;
      solved=true;
      showSolution();
      showCutin();
      highlightNext();
      if(opts.onResult)opts.onResult(true,elapsed);
    } else {
      if(checkCount>=MAX_CHECK||opts.singleCheck){
        judge.innerHTML=`<div class="judge-ng">✕ ざんねん…（${elapsed}秒）</div>`;
        showSolution();
        highlightNext();
        if(opts.onResult)opts.onResult(false,elapsed);
      } else {
        judge.innerHTML=`<div class="judge-ng">✕ ちがうよ。検算した？もう一度たしかめてみよう。</div>`;
      }
    }
    if(opts.afterCheck)opts.afterCheck(allOk,solved,checkCount);
  }
  wrap.querySelector('#btnCheck').onclick=checkAnswer;
  return wrap;
}
function showCutin(){
  const c=choice(Math.random,CHARS)||CHARS[0];
  const say=c.says[Math.floor(Math.random()*c.says.length)];
  const el=document.getElementById('cutin');
  document.getElementById('cutinMsg').textContent=say;
  el.style.display='flex';
  setTimeout(()=>{el.style.display='none';},900);
}

// ---------- 習得モード ----------
function renderMastery(main){
  // 問題一覧から指定された解法があれば最優先。なければ復習が期限のものを優先、次に未習得の先頭
  const focusKey=RUNTIME.masteryFocusKey;
  let target=null, isReview=false, isFocus=false;
  if(focusKey){
    target=PROBLEMS.find(p=>p.key===focusKey);
    if(target){
      isFocus=true;
      isReview=getSrs(focusKey).status==='mastered';
    }
  }
  if(!target){
    const unlocked=PROBLEMS.filter(p=>isRoundUnlocked(p.round));
    const dueList=unlocked.filter(p=>isDueToday(p.key));
    if(dueList.length){ target=dueList[0]; isReview=true; }
    else {
      target=unlocked.find(p=>getSrs(p.key).status!=='mastered');
    }
  }
  if(!target){
    main.innerHTML=`<div class="card"><h3>🎉 解放ずみの解法、習得完了！</h3><p>すごい！つぎの回が解放されたらまたここに表示されます。</p></div>`;
    return;
  }
  const s=getSrs(target.key);
  const stageLabel=isReview?'復習（支援なし）':(s.stage===0?'低（支援あり）':'高（支援なし）');
  const rng=makeRng(Date.now()^Math.floor(Math.random()*1e9));
  const q=GEN[target.key](rng);
  const showHint=isReview?false:(s.stage===0);
  renderQuestionCard(main,q,{
    badge:`${isFocus?'（問題一覧から）':''}第${target.round}回 ／ ${stageLabel} ／ 進捗 ${isReview?'復習1問':(s.stage===0? s.low+'/'+DRILL_STREAK : s.high+'/'+DRILL_STREAK)}`,
    showHint,
    extraButtons:'<button class="ghost small nextbtn" id="btnNext">つぎの問題</button>',
    onResult:(correct,sec)=>{
      recordAttempt(target.key,correct,sec);
      if(correct){
        if(isReview){
          DATA.mDaily[today()].reviews++; save();
        } else {
          DATA.mDaily[today()].learned++; save();
        }
        srsAdvanceCorrect(target.key);
      } else {
        srsAdvanceWrong(target.key);
        setFlag(target.key,'wrong');
      }
    }
  });
  const btnNext=document.getElementById('btnNext');
  if(btnNext)btnNext.onclick=()=>{
    RUNTIME={};
    if(isFocus && getSrs(target.key).status!=='mastered'){
      // まだ習得しきっていなければ同じ問題を継続
      RUNTIME.masteryFocusKey=target.key;
      go('mastery',true);
    } else {
      go('mastery');
    }
  };
}

// ---------- 苦手チェック ----------
function renderWeakCheck(main){
  if(!RUNTIME.wcQueue){
    RUNTIME.wcQueue=PROBLEMS.filter(p=>isRoundUnlocked(p.round)).map(p=>p.key);
    RUNTIME.wcIdx=0;
    RUNTIME.wcResult={answered:0,correct:0,newFlag:0};
  }
  if(RUNTIME.wcIdx>=RUNTIME.wcQueue.length){
    const r=RUNTIME.wcResult;
    const flaggedNow=Object.values(DATA.flags).filter(f=>f.on).length;
    DATA.wcHistory.push({date:today(),ts:Date.now(),answered:r.answered,correct:r.correct,newFlag:r.newFlag,flaggedNow});
    save();
    main.innerHTML=`<div class="card"><h3>苦手チェック 終了</h3>
      <div class="stat-row"><span>といた数</span><span>${r.answered}</span></div>
      <div class="stat-row"><span>正解数</span><span>${r.correct}</span></div>
      <div class="stat-row"><span>新しく🚩ついた数</span><span>${r.newFlag}</span></div>
      <div class="stat-row"><span>いまの苦手数</span><span>${flaggedNow}</span></div>
      <div class="btnrow"><button class="primary" onclick="go('home')">ホームへ</button></div>
    </div>`;
    return;
  }
  const key=RUNTIME.wcQueue[RUNTIME.wcIdx];
  const p=PROBLEMS.find(x=>x.key===key);
  const rng=makeRng(Date.now()^Math.floor(Math.random()*1e9));
  const q=GEN[key](rng);
  renderQuestionCard(main,q,{
    badge:`苦手チェック ${RUNTIME.wcIdx+1}/${RUNTIME.wcQueue.length}（第${p.round}回）`,
    showHint:false,
    singleCheck:true,
    extraButtons:'<button class="ghost small nextbtn" id="btnNext">つぎへ</button>',
    onResult:(correct,sec)=>{
      recordAttempt(key,correct,sec);
      RUNTIME.wcResult.answered++;
      if(correct)RUNTIME.wcResult.correct++;
      const wasFlagged=DATA.flags[key]&&DATA.flags[key].on;
      if(!correct||sec>=SLOW_SEC){
        const reason=(!correct&&sec>=SLOW_SEC)?'wrong+slow':(!correct?'wrong':'slow');
        setFlag(key,reason);
        if(!wasFlagged)RUNTIME.wcResult.newFlag++;
      }
    }
  });
  const btnNext=document.getElementById('btnNext');
  if(btnNext)btnNext.onclick=()=>{RUNTIME.wcIdx++;go('weakcheck');RUNTIME.wcQueue=RUNTIME.wcQueue;};
}
// wcQueueの保持のため、go()内でRUNTIMEをリセットしない特別扱いが必要
const _origGo=go;
go=function(mode,keepRuntime){
  if(mode==='weakcheck'&&CURRENT==='weakcheck'){
    // 継続（リセットしない）
    CURRENT=mode; renderNav(); renderHeaderStatus();
    const main=document.getElementById('main'); main.innerHTML='';
    renderWeakCheck(main);
    window.scrollTo(0,0);
    return;
  }
  if(mode==='list'&&CURRENT==='list'){
    // 問題一覧内の画面遷移（browse→round→solve）はRUNTIMEを保持する
    CURRENT=mode; renderNav(); renderHeaderStatus();
    const main=document.getElementById('main'); main.innerHTML='';
    renderList(main);
    window.scrollTo(0,0);
    return;
  }
  _origGo(mode,keepRuntime);
};

// ---------- にがて復習 ----------
function renderWeakDrill(main){
  const weakList=PROBLEMS.filter(p=>DATA.flags[p.key]&&DATA.flags[p.key].on&&isRoundUnlocked(p.round));
  if(!weakList.length){
    main.innerHTML=`<div class="card"><h3>いま苦手はありません🎉</h3><p>苦手チェックをして、にがてを見つけよう。</p></div>`;
    return;
  }
  if(!RUNTIME.drillKey){
    const main2=main;
    const listHtml=weakList.map(p=>{
      const f=DATA.flags[p.key];
      const doneToday=f.lastDoneDay===today();
      return `<div class="card mode-card" data-k="${p.key}" style="display:flex;justify-content:space-between;align-items:center;">
        <div><b>第${p.round}回</b> ${p.key} <span class="small-note">(${(f.days||[]).length}/${DRILL_DAYS}日クリア)</span></div>
        <div>${doneToday?'<span class="pill mastered">✅今日ずみ</span>':'<span class="pill on">未</span>'}</div>
      </div>`;
    }).join('');
    main2.innerHTML=`<div class="card"><h3>にがて復習：単元をえらぶ</h3><p class="small-note">選んだ単元を3問連続正解でその日クリア。別々の3日クリアで🚩解消。</p></div>${listHtml}
      <div class="card"><button class="primary" id="btnOmakase">今日やる分をまとめて（おまかせ）</button></div>`;
    main2.querySelectorAll('.mode-card').forEach(el=>{
      el.onclick=()=>{RUNTIME.drillKey=el.dataset.k;RUNTIME.drillStreak=0;go('weakdrill');};
    });
    main2.querySelector('#btnOmakase').onclick=()=>{
      const notDone=weakList.filter(p=>!(DATA.flags[p.key].lastDoneDay===today()));
      if(notDone.length){RUNTIME.drillKey=notDone[0].key;RUNTIME.drillStreak=0;go('weakdrill');}
    };
    return;
  }
  const key=RUNTIME.drillKey;
  const p=PROBLEMS.find(x=>x.key===key);
  RUNTIME.drillStreak=RUNTIME.drillStreak||0;
  const rng=makeRng(Date.now()^Math.floor(Math.random()*1e9));
  const q=GEN[key](rng);
  renderQuestionCard(main,q,{
    badge:`にがて復習：第${p.round}回 ／ 連続正解 ${RUNTIME.drillStreak}/${DRILL_STREAK}`,
    showHint:true,
    extraButtons:'<button class="ghost small" id="btnBack">単元をえらび直す</button> <button class="ghost small" id="btnSkip">単元スキップ</button>',
    onResult:(correct,sec)=>{
      recordAttempt(key,correct,sec);
      if(correct){
        RUNTIME.drillStreak++;
        if(RUNTIME.drillStreak>=DRILL_STREAK){
          const f=DATA.flags[key];
          if(f.lastDoneDay!==today()){
            f.days=f.days||[];
            f.days.push(today());
            f.lastDoneDay=today();
            if(f.days.length>=DRILL_DAYS){
              clearFlag(key);
            }
            save();
          }
          setTimeout(()=>{RUNTIME.drillKey=null;go('weakdrill');},600);
        }
      } else {
        RUNTIME.drillStreak=0;
      }
    }
  });
  const btnBack=document.getElementById('btnBack');
  if(btnBack)btnBack.onclick=()=>{RUNTIME.drillKey=null;go('weakdrill');};
  const btnSkip=document.getElementById('btnSkip');
  if(btnSkip)btnSkip.onclick=()=>{RUNTIME.drillKey=null;RUNTIME.drillStreak=0;go('weakdrill');};
}

// ---------- チャレンジモード ----------
function renderChallenge(main){
  if(!RUNTIME.chQueue){
    RUNTIME.chQueue=PROBLEMS.filter(p=>isRoundUnlocked(p.round)).map(p=>p.key).sort(()=>Math.random()-0.5);
    RUNTIME.chIdx=0; RUNTIME.chSkips=[]; RUNTIME.chStart=Date.now(); RUNTIME.chSolved=0; RUNTIME.chTotal=RUNTIME.chQueue.length;
  }
  const total=RUNTIME.chTotal;
  const elapsedMs=Date.now()-RUNTIME.chStart;
  if(elapsedMs>=CH_LIMIT_MS||(RUNTIME.chIdx>=RUNTIME.chQueue.length&&!RUNTIME.chSkips.length)){
    const ms=elapsedMs;
    const best=DATA.challenge.best;
    const isNewBest=(best==null||ms<best)&&RUNTIME.chSolved>=total;
    if(isNewBest)DATA.challenge.best=ms;
    DATA.challenge.history.push({date:today(),ms,solved:RUNTIME.chSolved,total:total,skips:RUNTIME.chSkips.length,status:RUNTIME.chSolved>=total?'clear':'timeup'});
    save();
    main.innerHTML=`<div class="card"><h3>チャレンジ 終了</h3>
      <div class="stat-row"><span>結果</span><span>${RUNTIME.chSolved}/${total} 問正解</span></div>
      <div class="stat-row"><span>タイム</span><span>${(ms/1000).toFixed(1)}秒</span></div>
      ${isNewBest?'<div class="judge-ok">🏆 自己ベスト更新！</div>':''}
      <div class="btnrow"><button class="primary" onclick="go('home')">ホームへ</button></div>
    </div>`;
    RUNTIME={};
    return;
  }
  let key;
  if(RUNTIME.chIdx<RUNTIME.chQueue.length){key=RUNTIME.chQueue[RUNTIME.chIdx];}
  else {key=RUNTIME.chSkips.shift();}
  const p=PROBLEMS.find(x=>x.key===key);
  const remain=Math.max(0,CH_LIMIT_MS-elapsedMs);
  const rng=makeRng(Date.now()^Math.floor(Math.random()*1e9));
  const q=GEN[key](rng);
  renderQuestionCard(main,q,{
    badge:`チャレンジ ／ のこり時間 ${Math.floor(remain/60000)}分${Math.floor(remain/1000)%60}秒 ／ ベスト ${DATA.challenge.best?(DATA.challenge.best/1000).toFixed(1)+'秒':'なし'}`,
    showHint:false,
    singleCheck:true,
    extraButtons:'<button class="ghost small" id="btnSkip">スキップ</button>',
    onResult:(correct,sec)=>{
      recordAttempt(key,correct,sec);
      if(correct)RUNTIME.chSolved++;
      else RUNTIME.chSkips.push(key);
      if(RUNTIME.chIdx<RUNTIME.chQueue.length)RUNTIME.chIdx++;
      setTimeout(()=>go('challenge'),800);
    }
  });
  const btnSkip=document.getElementById('btnSkip');
  if(btnSkip)btnSkip.onclick=()=>{
    RUNTIME.chSkips.push(key);
    if(RUNTIME.chIdx<RUNTIME.chQueue.length)RUNTIME.chIdx++;
    go('challenge');
  };
}

// ---------- きろく ----------
function renderRecords(main){
  const dailyRows=Object.entries(DATA.mDaily).sort((a,b)=>b[0]<a[0]?-1:1).slice(0,14).map(([d,v])=>
    `<tr><td>${d}</td><td>${v.learned}</td><td>${v.reviews}</td><td>${v.correct}/${v.attempts}</td><td>${Math.round(v.timeSec/60)}分</td></tr>`
  ).join('');
  const weakRows=PROBLEMS.filter(p=>DATA.flags[p.key]&&DATA.flags[p.key].on).map(p=>{
    const f=DATA.flags[p.key];
    return `<tr><td>第${p.round}回</td><td>${p.key}</td><td>${f.reason}</td><td>${(f.days||[]).length}/${DRILL_DAYS}</td></tr>`;
  }).join('')||'<tr><td colspan="4">なし</td></tr>';
  const wcRows=DATA.wcHistory.slice(-10).reverse().map(h=>
    `<tr><td>${h.date}</td><td>${h.correct}/${h.answered}</td><td>+${h.newFlag}</td><td>${h.flaggedNow}</td></tr>`
  ).join('')||'<tr><td colspan="4">なし</td></tr>';

  main.innerHTML=`
    <div class="card"><h3>日々の学習</h3>
      <table class="rec"><tr><th>日付</th><th>習得</th><th>復習</th><th>正解/挑戦</th><th>時間</th></tr>${dailyRows||'<tr><td colspan="5">まだ記録なし</td></tr>'}</table>
    </div>
    <div class="card"><h3>苦手一覧🚩</h3>
      <table class="rec"><tr><th>回</th><th>解法</th><th>理由</th><th>進捗</th></tr>${weakRows}</table>
    </div>
    <div class="card"><h3>苦手チェック履歴</h3>
      <table class="rec"><tr><th>日付</th><th>正解</th><th>新規🚩</th><th>現在の苦手数</th></tr>${wcRows}</table>
    </div>
    <div class="card"><h3>チャレンジ記録</h3>
      <div class="stat-row"><span>自己ベスト</span><span>${DATA.challenge.best?(DATA.challenge.best/1000).toFixed(1)+'秒':'まだ挑戦なし'}</span></div>
    </div>
    <div class="card">
      <button class="ghost" id="btnResetFlags">🚩 苦手フラグをリセット</button>
      <button class="ghost" id="btnClearAll" style="color:#c0392b;">🧹 キャッシュ・記録をぜんぶクリア</button>
      <button class="ghost" id="btnLogout" style="color:#8a7a6a;">🔑 あいことばを変える</button>
    </div>
  `;
  main.querySelector('#btnResetFlags').onclick=()=>{
    if(confirm('苦手フラグと履歴だけを消します。よろしいですか？')){
      DATA.flags={}; DATA.flagLog=[]; DATA.wcHistory=[]; save(); go('records');
    }
  };
  main.querySelector('#btnClearAll').onclick=()=>{
    if(confirm('すべてのデータを消してリロードします。よろしいですか？')){
      try{localStorage.removeItem(KEY);}catch(e){}
      location.reload();
    }
  };
  main.querySelector('#btnLogout').onclick=()=>{
    if(confirm('いまの あいことば から ログアウトしますか？\n（つぎに べつの あいことば で ログインできます）')){
      gateLogout();
    }
  };
}
